<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Управление Репетиторами</title>
</head>
<body>
    <h1>Список репетиторов</h1>

    <h2>Добавить репетитора</h2>
    <input type="text" id="name" placeholder="Имя">
    <input type="text" id="subject" placeholder="Предмет">
    <button onclick="addTutor()">Добавить</button>

    <h2>Все репетиторы</h2>
    <ul id="tutorList"></ul>

    <script>
        const API_URL = 'api/tutors';

        async function loadTutors() {
            const res = await fetch(API_URL);
            const data = await res.json();
            const list = document.getElementById('tutorList');
            list.innerHTML = '';
            data.forEach(t => {
                list.innerHTML += `
                    <li>
                        ${t.name} (${t.subject}) 
                        <button onclick="deleteTutor(${t.id})">Удалить</button>
                    </li>`;
            });
        }

        async function addTutor() {
            const name = document.getElementById('name').value;
            const subject = document.getElementById('subject').value;
            await fetch(API_URL, {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({ name, subject })
            });
            document.getElementById('name').value = '';
            document.getElementById('subject').value = '';
            loadTutors();
        }

        async function deleteTutor(id) {
            await fetch(`${API_URL}/${id}`, { method: 'DELETE' });
            loadTutors();
        }

        loadTutors();
    </script>
</body>
</html>
